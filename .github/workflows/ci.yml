name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Run the backend tests
        run: ./mvnw -B verify

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

  mysql-tests:
    name: Backend tests on MySQL
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Native MySQL service and root account documented in the runner image:
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#mysql
      - name: Start MySQL and create the test database
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql.service
          mysql -h 127.0.0.1 -u root <<'SQL'
          CREATE DATABASE servicedesk_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs;
          CREATE USER 'servicedesk_test'@'localhost' IDENTIFIED BY 'mysql-test-password';
          GRANT ALL PRIVILEGES ON servicedesk_test.* TO 'servicedesk_test'@'localhost';
          SQL

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # JVM properties override the H2 settings in the test profile.
      # create-drop runs only against this disposable test database.
      - name: Run the backend tests against MySQL
        run: >-
          ./mvnw -B verify
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/servicedesk_test
          -Dspring.datasource.username=servicedesk_test
          -Dspring.datasource.password=mysql-test-password
          -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
