# Test profile.
#
# The tests run against an in-memory H2 database in PostgreSQL compatibility
# mode, so a developer (or CI) does not need a real PostgreSQL server running
# just to run the test suite. The main application.properties is still loaded,
# and these values simply override the datasource.

spring.datasource.url=jdbc:h2:mem:servicedesk_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Recreate the schema for every test run so tests start from a clean database.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fixed JWT settings so tests do not depend on environment variables.
app.jwt.secret=servicedesk-test-secret-key-long-enough-for-hs256
app.jwt.expiration-ms=3600000
