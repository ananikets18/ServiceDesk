# ------------------------------------------------------------------
# ServiceDesk application configuration
# ------------------------------------------------------------------
spring.application.name=ServiceDesk

# ------------------------------------------------------------------
# Server
# Defaults to 8080. Hosting platforms (like Render) set PORT for us,
# so we read it from the environment when it is there.
# ------------------------------------------------------------------
server.port=${PORT:8080}

# ------------------------------------------------------------------
# PostgreSQL connection
# The password comes from the DB_PASSWORD environment variable so we
# never keep secrets in the source code. Set it before running, e.g.
#   PowerShell:  $env:DB_PASSWORD="your-password"
# Change the username/database below to match your local setup.
# ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/servicedesk_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# "update" means Hibernate creates or updates tables to match our
# entity classes automatically. Handy while learning.
# SQL logging is off by default (a deployed app should not log every
# query); set SHOW_SQL=true locally if you want to see the statements.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# ------------------------------------------------------------------
# JWT
# The secret also comes from the environment. It has to be at least
# 32 characters long because HS256 needs a 256-bit key.
#   PowerShell:  $env:JWT_SECRET="a-long-random-string-at-least-32-chars"
# The token is valid for 24 hours.
# ------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------------
# CORS
# Which frontend addresses are allowed to call this API in the
# browser. In development that is the Vite dev server. After deploying
# the frontend, override this with the APP_CORS_ALLOWED_ORIGINS
# environment variable (comma-separate several origins if needed).
# ------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173
